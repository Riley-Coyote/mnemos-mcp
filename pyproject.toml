[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemos-continuity"
version = "0.6.6"
description = "Continuity for the agent itself. An MCP server that gives an AI agent a memory of its own, written in its own words and kept on your machine, so it wakes as itself every session."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Riley Ralmuto", email = "r.ralmuto@gmail.com" },
]
keywords = ["ai", "agents", "memory", "mcp", "continuity", "cognitive-architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # mcp is core: the MCP server is the primary product, and it is imported
    # at module scope. Shipping it as an optional extra made a clean install
    # yield a dead `mnemos serve` with the failure hidden on stderr.
    # Both majors work: mcp 2.0 renamed FastMCP to MCPServer and moved it, and
    # mnemos/mcp_compat.py is the one place Mnemos meets either. 2.x has to
    # work because Hermes pins it in its own environment, where its plugin
    # catalog installs Mnemos. Capped below 3, a major nobody has tested: an
    # unbounded range once let a fresh `pip install` resolve 2.0 and produce a
    # server that died on import, while CI, pinned by the lockfile, passed.
    # CI runs the tests on the locked 1.x and on 2.x, and the wheel smoke job
    # in release-hardening.yml installs unlocked. The floor is the first 1.x
    # with the fix for GHSA-84m7-p3x7-pcfv (an HTTP-transport leak; Mnemos
    # serves over stdio and was never exposed, but an audit would rightly flag
    # anything older).
    "mcp[cli]>=1.30.0,<3",
    "ulid-py>=1.1.0,<2",
    # `mnemos connect hermes` edits Hermes's config.yaml. As it came only with
    # the embeddings extra, a plain install stopped there and connected nothing.
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Kept as a no-op for backwards-compatible install commands; mcp is now core.
mcp = []

# Local semantic recall, no API key and nothing leaves the machine. Costs
# roughly 700 MB once torch is resolved, which is why it is not core: on a
# real store it changed ~8% of retrieval results, and the continuity path
# does not use embeddings at all. `mnemos doctor` always states which
# retrieval this install actually has.
embeddings = ["sentence-transformers>=2.2.0"]

# Hosted embeddings instead of local ones, used only when chosen for Mnemos
# (MNEMOS_EMBEDDING_PROVIDER=gemini, or embeddings.provider in its config)
# with GEMINI_API_KEY set: the words of every memory and question it embeds go
# to Google. A key on its own chooses nothing.
gemini = ["google-generativeai>=0.5.0"]

anthropic = ["anthropic>=0.25.0"]
all = [
    "sentence-transformers>=2.2.0",
    "google-generativeai>=0.5.0",
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    # test_pure_python_matches_numpy compares numpy's path with pure Python's
    "numpy>=1.24",
]

[tool.coverage.run]
branch = true
source = [
    "mnemos.simple_runtime",
    "mnemos.simple_mcp",
    "mnemos.simple_scope",
    "mnemos.backup",
    "mnemos.file_security",
    "mnemos.store.sqlite_store",
    "mnemos.setup.scheduler",
]

[tool.coverage.report]
fail_under = 80
skip_covered = true

[tool.ruff.lint]
# Start with correctness failures that can ship broken code. Broader style
# cleanup remains separate from the release gate so it cannot hide real risk
# in hundreds of legacy formatting changes.
select = ["E9", "F63", "F7", "F82"]

[project.scripts]
mnemos = "mnemos.cli:main"

[project.urls]
Homepage = "https://github.com/Riley-Coyote/mnemos-mcp"
Repository = "https://github.com/Riley-Coyote/mnemos-mcp"
Issues = "https://github.com/Riley-Coyote/mnemos-mcp/issues"
Documentation = "https://github.com/Riley-Coyote/mnemos-mcp/blob/main/docs/guide.md"
Changelog = "https://github.com/Riley-Coyote/mnemos-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "mnemos/setup/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # From Python 3.13 a SQLite connection collected unclosed says so, with
    # itself as the warning's source, and pytest keeps every warning it
    # records until the session ends. So the connection outlives its own
    # finalizer and its files stay open, three for each one. The suite leaves
    # a few hundred to the collector; under coverage, where they are collected
    # late and while pytest is recording, the run passed 1,024 open files,
    # where select() stops working (test_windows_hook_stdin, on Linux).
    # Unrecorded, each closes when it is collected, as it always has.
    "ignore:unclosed database:ResourceWarning",
]
markers = [
    "lived_time: runs on the agent's real lived days, not the suite's every day lived (see tests/conftest.py)",
]
